name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend:
        name: Build and Test Backend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout code
                uses: actions/checkout@v4

            - name: Set up Go
                uses: actions/setup-go@v5
                with:
                    go-version-file: backend/go.mod

            - name: Download dependencies
                run: go mod download

            - name: Build
                run: go build ./...

            - name: Test
                run: go test ./...
        